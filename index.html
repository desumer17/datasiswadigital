<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manajemen Data Siswa Digital</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome & SweetAlert2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* Custom Styles & PWA adjustments */
        body { -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 800; background-color: #eff6ff; }
        
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }

        /* Print Layout (CV Style) */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #app-container { max-width: 100%; padding: 0; box-shadow: none; }
            .cv-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
            .cv-section { margin-bottom: 15px; }
            .cv-section-title { font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #ccc; margin-bottom: 10px; }
            .cv-row { display: flex; margin-bottom: 5px; page-break-inside: avoid;}
            .cv-label { width: 35%; font-weight: 600; }
            .cv-value { width: 65%; }
        }
        
        /* Foto Bulat Sempurna untuk CV */
        .cv-photo { 
            width: 150px; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 50%; 
            margin: 0 auto 20px auto; 
            display: block; 
            border: 4px solid #e5e7eb; 
        }

        .print-only { display: none; }
        
        /* Hide scrollbar for tabs navigation */
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- Loading Overlay -->
    <div id="overlay">
        <div class="loader mb-2"></div>
        <p class="text-blue-600 font-semibold" id="loading-text">Memproses Data...</p>
    </div>

    <!-- PWA Install Banner -->
    <div id="install-banner" class="hidden bg-blue-600 text-white p-4 flex justify-between items-center shadow-md no-print fixed top-0 w-full z-50">
        <div class="flex items-center gap-3">
            <i class="fas fa-download text-2xl"></i>
            <div>
                <p class="font-bold">Instal Aplikasi Siswa</p>
                <p class="text-xs">Akses lebih cepat dari layar utama HP Anda</p>
            </div>
        </div>
        <button id="btn-install" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-bold text-sm shadow">Instal</button>
    </div>

    <!-- Main Container -->
    <div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-lg relative pt-16">
        
        <!-- HEADER SD NEGERI 17 DAUH PURI -->
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-40 shadow-md no-print fixed w-full max-w-md">
            <div class="flex justify-between items-center">
                <div class="flex flex-col">
                    <h1 class="text-lg font-bold flex items-center">
                        <i class="fas fa-graduation-cap mr-2 text-2xl"></i>Data Siswa Digital
                    </h1>
                    <p class="text-sm text-blue-100 font-medium ml-8 mt-0.5">SD Negeri 17 Dauh Puri</p>
                </div>
                <button id="btn-logout" class="hidden text-sm hover:bg-blue-800 transition bg-blue-700 px-3 py-2 rounded-lg shadow" onclick="konfirmasiKeluar()">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>
        </header>

        <!-- VIEW: LOGIN -->
        <div id="view-login" class="p-6">
            <div class="text-center mb-8 mt-4">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" class="w-24 mx-auto mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Selamat Datang</h2>
                <p class="text-sm text-gray-500">Silakan login untuk melanjutkan</p>
            </div>

            <!-- Login Tabs -->
            <div class="flex border-b mb-6 rounded-t-lg overflow-hidden">
                <button class="flex-1 py-3 text-center tab-active text-blue-600 transition" id="tab-login-siswa" onclick="switchLoginTab('siswa')">
                    <i class="fas fa-user-graduate mr-1"></i> Siswa
                </button>
                <button class="flex-1 py-3 text-center text-gray-500 hover:bg-gray-50 transition" id="tab-login-guru" onclick="switchLoginTab('guru')">
                    <i class="fas fa-chalkboard-teacher mr-1"></i> Guru/Admin
                </button>
            </div>

            <!-- Form Siswa -->
            <form id="form-login-siswa" onsubmit="handleLoginSiswa(event)">
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1">NISN</label>
                    <input type="number" id="login-nisn" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan NISN">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-1">Tanggal Lahir</label>
                    <input type="date" id="login-tgl" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md"><i class="fas fa-sign-in-alt mr-2"></i> Masuk sebagai Siswa</button>
            </form>

            <!-- Form Guru -->
            <form id="form-login-guru" class="hidden" onsubmit="handleLoginGuru(event)">
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1">Username Admin</label>
                    <input type="text" id="login-user" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan Username">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-1">Password Sistem</label>
                    <input type="password" id="login-pass" required class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan Password">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-md"><i class="fas fa-sign-in-alt mr-2"></i> Masuk sebagai Guru</button>
            </form>
        </div>

        <!-- VIEW: SISWA DASHBOARD -->
        <div id="view-siswa" class="hidden pb-24 no-print">
            
            <!-- HEADER PROFIL SISWA DENGAN FOTO -->
            <div class="p-4 bg-blue-50 border-b flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="siswa-dashboard-foto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" alt="Foto Siswa">
                    <div>
                        <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider mb-0.5" id="siswa-nama-display">Nama Siswa</p>
                        <p class="font-black text-lg text-gray-800 leading-none" id="siswa-nisn-display">-</p>
                    </div>
                </div>
                <span id="siswa-status-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800 border border-green-200 shadow-sm">Aktif</span>
            </div>

            <!-- Dynamic Tabs Navigation -->
            <div class="overflow-x-auto whitespace-nowrap bg-white border-b flex px-2 custom-scrollbar" id="siswa-tabs-nav"></div>

            <!-- Dynamic Tab Content -->
            <div id="siswa-tabs-content" class="p-4 bg-gray-50 min-h-[50vh]"></div>
            
            <div class="p-4 border-t fixed bottom-0 max-w-md w-full bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-30">
                 <button onclick="pemicuSimpanData()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 transition"><i class="fas fa-save mr-2"></i> Simpan Semua Perubahan</button>
            </div>
        </div>

        <!-- VIEW: GURU DASHBOARD -->
        <div id="view-guru" class="hidden no-print">
            
            <!-- WADAH STATISTIK REKAPAN OTOMATIS GURU -->
            <div class="p-4 bg-gray-100 border-b">
                <div id="guru-rekapan-container"></div>
            </div>

            <!-- TABEL DAN PENCARIAN -->
            <div class="p-4 bg-white sticky top-[60px] z-30 border-b shadow-sm">
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                        <input type="text" id="search-siswa" onkeyup="filterSiswa()" class="w-full border rounded-lg pl-10 p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Cari nama atau NISN...">
                    </div>
                    <!-- TOMBOL UNDUH EXCEL -->
                    <button onclick="exportKeExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 rounded-lg shadow whitespace-nowrap" title="Unduh Excel">
                        <i class="fas fa-file-excel"></i>
                    </button>
                </div>
            </div>
            
            <div id="list-siswa" class="divide-y pb-10">
                <!-- List generated by JS -->
            </div>
        </div>

        <!-- VIEW: GURU - DETAIL SISWA -->
        <div id="view-guru-detail" class="hidden no-print pb-20">
            <div class="p-4 border-b flex items-center gap-3 bg-white sticky top-[60px] z-30 shadow-sm">
                <button onclick="closeDetailSiswa()" class="text-blue-600 p-2 font-bold hover:bg-blue-50 rounded"><i class="fas fa-arrow-left mr-1"></i> Kembali</button>
                <div class="flex-1"></div>
                <button onclick="window.print()" class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-black transition"><i class="fas fa-print mr-1"></i> Cetak CV</button>
            </div>
            <div id="detail-siswa-content" class="p-4 bg-gray-50">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- PRINT LAYOUT (Hidden from screen, shown on print) -->
        <div id="print-layout" class="print-only p-8">
            <div class="cv-header">
                <h1 class="text-3xl font-bold uppercase">Biodata Siswa</h1>
                <p class="text-2xl font-bold uppercase mt-1 text-gray-800">SD Negeri 17 Dauh Puri</p>
            </div>
            <div id="print-content">
                <!-- Generated dynamically for print -->
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // CONFIGURATION (DARI FILE ASLI ANDA)
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7sjdaWIggAWOYAePBo67F1bf_goyn7OS2AsiZV9Rjb_kw38285m_o9wvZJeisnQmP/exec'; 

        // ==========================================
        // STATE & HELPERS
        // ==========================================
        let appState = {
            role: null, formStructure: [], studentData: null, allStudents: [], pendingUpdates: {} 
        };

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-banner').classList.remove('hidden');
        });

        document.getElementById('btn-install').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-banner').classList.add('hidden');
                deferredPrompt = null;
            }
        });

        function showLoading(text = 'Memproses...') {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('overlay').style.display = 'flex';
        }
        function hideLoading() { document.getElementById('overlay').style.display = 'none'; }

        function switchView(viewId) {
            ['view-login', 'view-siswa', 'view-guru', 'view-guru-detail'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            document.getElementById('btn-logout').classList.toggle('hidden', viewId === 'view-login');
        }

        function switchLoginTab(role) {
            if(role === 'siswa'){
                document.getElementById('tab-login-siswa').className = 'flex-1 py-3 text-center tab-active text-blue-600 transition';
                document.getElementById('tab-login-guru').className = 'flex-1 py-3 text-center text-gray-500 hover:bg-gray-50 transition';
                document.getElementById('form-login-siswa').classList.remove('hidden');
                document.getElementById('form-login-guru').classList.add('hidden');
            } else {
                document.getElementById('tab-login-guru').className = 'flex-1 py-3 text-center tab-active text-blue-600 transition';
                document.getElementById('tab-login-siswa').className = 'flex-1 py-3 text-center text-gray-500 hover:bg-gray-50 transition';
                document.getElementById('form-login-guru').classList.remove('hidden');
                document.getElementById('form-login-siswa').classList.add('hidden');
            }
        }

        function formatCurrencyInput(input) {
            let value = input.value.replace(/\D/g, "");
            if(value === "") { input.value = ""; return; }
            input.value = "Rp " + new Intl.NumberFormat('id-ID').format(value);
            input.setAttribute('data-raw-value', value);
            appState.pendingUpdates[input.name] = value;
        }

        // ==========================================
        // FUNGSI UTILITY (KONFIRMASI, KONVERSI, IKON)
        // ==========================================
        function getIconForTab(tabName) {
            let lower = tabName.toLowerCase();
            if(lower.includes('profil')) return 'fas fa-user-circle';
            if(lower.includes('pribadi')) return 'fas fa-id-card';
            if(lower.includes('kesehatan') || lower.includes('medis')) return 'fas fa-heartbeat';
            if(lower.includes('tinggal') || lower.includes('alamat')) return 'fas fa-home';
            if(lower.includes('orang tua') || lower.includes('ortu')) return 'fas fa-user-friends';
            if(lower.includes('kartu keluarga') || lower.includes('kk')) return 'fas fa-address-book';
            if(lower.includes('rapor') || lower.includes('nilai')) return 'fas fa-book-open';
            if(lower.includes('kelulusan') || lower.includes('ijazah')) return 'fas fa-graduation-cap';
            if(lower.includes('prestasi') || lower.includes('penghargaan')) return 'fas fa-trophy';
            if(lower.includes('berkas') || lower.includes('dokumen')) return 'fas fa-folder-open';
            return 'fas fa-folder'; 
        }

        function pemicuSimpanData() {
            Swal.fire({
                title: 'Simpan Perubahan?',
                text: "Apakah Anda yakin data yang Anda masukkan sudah benar?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#d33',
                confirmButtonText: '<i class="fas fa-check mr-1"></i> Ya, Simpan!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    saveAllSiswaData(); // PANGGIL FUNGSI SIMPAN ASLI
                }
            });
        }

        function konfirmasiKeluar() {
            Swal.fire({
                title: 'Ingin Keluar Aplikasi?',
                text: "Pastikan Anda telah menyimpan perubahan data Anda.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#2563eb',
                confirmButtonText: '<i class="fas fa-sign-out-alt mr-1"></i> Ya, Keluar',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) window.location.reload(); 
            });
        }

        function konversiTanggalKeHTML(dateStr) {
            if (!dateStr || dateStr === '-') return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
            let parts = dateStr.toString().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (parts) return `${parts[3]}-${parts[2].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
            try {
                let d = new Date(dateStr);
                if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            } catch (e) {}
            return '';
        }

        // ==========================================
        // EXPORT TO EXCEL DARI DATA GOOGLE SHEET
        // ==========================================
        function exportKeExcel() {
            if(!appState.allStudents || appState.allStudents.length === 0) {
                Swal.fire('Info', 'Tidak ada data siswa untuk diunduh.', 'info');
                return;
            }
            let csv = [];
            
            // Buat Header berdasar struktur Google Sheet
            let headers = ['NISN', 'Tanggal Lahir', 'Status'];
            appState.formStructure.forEach(f => headers.push(f.headerName));
            csv.push(headers.map(h => `"${h}"`).join(','));

            // Isi Data
            appState.allStudents.forEach(stu => {
                let row = [stu.nisn, stu.tglLahir, stu.status];
                appState.formStructure.forEach(f => {
                    let val = stu.fields[f.headerName] || '';
                    val = val.toString().replace(/(\r\n|\n|\r)/gm, " ").replace(/"/g, '""');
                    row.push(`"${val}"`);
                });
                csv.push(row.join(','));
            });

            // Trigger Download
            let csvContent = "data:text/csv;charset=utf-8," + csv.join("\n");
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Data_Siswa_SDN17_Dauh_Puri.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ==========================================
        // API COMMUNICATION (KE GOOGLE APPS SCRIPT)
        // ==========================================
        async function fetchGAS(payload) {
            if(!GAS_URL || GAS_URL.includes('MASUKKAN_URL')) {
                Swal.fire('Error', 'URL Apps Script belum disetting di kode HTML.', 'error');
                return null;
            }
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (error) {
                console.error("Fetch Error:", error);
                return null; // Akan ditangani di fungsi pemanggil
            }
        }

        async function handleLoginSiswa(e) {
            e.preventDefault();
            const nisn = document.getElementById('login-nisn').value;
            const tgl = document.getElementById('login-tgl').value;
            
            showLoading('Mencari data siswa...');
            const res = await fetchGAS({ action: 'loginSiswa', nisn: nisn, tglLahir: tgl });
            hideLoading();

            if (res && res.status === 'success') {
                appState.role = 'siswa';
                appState.formStructure = res.formStructure;
                appState.studentData = res.data;
                appState.pendingUpdates = {};
                buildSiswaDashboard();
                switchView('view-siswa');
            } else {
                Swal.fire('Gagal', (res && res.message) ? res.message : 'Koneksi gagal atau data tidak ditemukan.', 'error');
            }
        }

        async function handleLoginGuru(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            
            showLoading('Otentikasi Guru...');
            const res = await fetchGAS({ action: 'loginGuru', username: user, password: pass });
            hideLoading();

            if (res && res.status === 'success') {
                appState.role = 'guru';
                appState.formStructure = res.formStructure;
                appState.allStudents = res.students;
                buildGuruDashboard();
                switchView('view-guru');
            } else {
                Swal.fire('Gagal', (res && res.message) ? res.message : 'Koneksi gagal atau Username/Password salah.', 'error');
            }
        }

        // ==========================================
        // FUNGSI UPLOAD FILE KE GOOGLE DRIVE
        // ==========================================
        async function processFileUpload(fileInput, fieldDef) {
            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            
            if (file.type === 'application/pdf' && file.size > 2 * 1024 * 1024) {
                Swal.fire('Ukuran Terlalu Besar', 'Untuk PDF mohon kompres dulu di bawah 2MB sebelum upload.', 'warning');
                return;
            }

            showLoading('Mengkompres & Mengupload...');

            try {
                let base64Data = '';
                let namaSiswa = "Siswa";
                // Cari Nama Siswa untuk penamaan file
                for (let key in appState.studentData.fields) {
                    if (key.toLowerCase().includes('nama')) {
                        namaSiswa = appState.studentData.fields[key] || appState.studentData.nisn;
                        break;
                    }
                }

                let extension = file.name.split('.').pop();
                let cleanLabel = fieldDef.label.replace(/[^a-zA-Z0-9 ]/g, "");
                let newFileName = `${cleanLabel}_${namaSiswa}.${extension}`;

                if (file.type.startsWith('image/')) {
                    base64Data = await compressImage(file);
                } else {
                    base64Data = await fileToBase64(file);
                }

                let base64String = base64Data.split(',')[1];
                const res = await fetchGAS({
                    action: 'uploadFile', nisn: appState.studentData.nisn,
                    headerName: fieldDef.headerName, fileName: newFileName,
                    mimeType: file.type, base64: base64String
                });
                
                hideLoading();

                if (res && res.status === 'success') {
                    Swal.fire('Berhasil', 'Berkas berhasil disimpan ke Drive.', 'success');
                    appState.studentData.fields[fieldDef.headerName] = res.fileUrl;
                    buildSiswaDashboard(); 
                } else {
                    Swal.fire('Gagal Upload', res ? res.message : 'Terjadi kesalahan sistem.', 'error');
                }
            } catch (error) {
                hideLoading();
                Swal.fire('Error', 'Terjadi kesalahan saat memproses file.', 'error');
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    }
                };
                reader.onerror = error => reject(error);
            });
        }

        // ==========================================
        // FUNGSI SIMPAN DATA KE GOOGLE SHEET
        // ==========================================
        async function saveAllSiswaData() {
            if (Object.keys(appState.pendingUpdates).length === 0) {
                Swal.fire('Info', 'Tidak ada perubahan data yang perlu disimpan.', 'info');
                return;
            }

            showLoading('Menyimpan Data...');
            const res = await fetchGAS({
                action: 'updateData',
                nisn: appState.studentData.nisn,
                updates: appState.pendingUpdates
            });
            hideLoading();

            if (res && res.status === 'success') {
                Swal.fire('Berhasil', 'Data berhasil diperbarui.', 'success');
                // Terapkan perubahan ke state lokal
                for(let key in appState.pendingUpdates){
                    appState.studentData.fields[key] = appState.pendingUpdates[key];
                }
                appState.pendingUpdates = {}; 
                buildSiswaDashboard(); // Refresh UI agar nama/foto terbaru langsung tampil
            } else {
                Swal.fire('Gagal', res ? res.message : 'Koneksi bermasalah', 'error');
            }
        }

        // ==========================================
        // SISWA DASHBOARD LOGIC (DENGAN FILTER & IKON)
        // ==========================================
        function buildSiswaDashboard() {
            // ---- MENCARI FOTO & NAMA UNTUK DITAMPILKAN DI HEADER ----
            let fotoUrl = 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'; // Default
            let namaSiswa = 'Tanpa Nama';

            if (appState.studentData && appState.studentData.fields) {
                for (let key in appState.studentData.fields) {
                    let val = appState.studentData.fields[key];
                    if (!val || val === '-') continue;

                    let keyLower = key.toLowerCase();
                    if (keyLower.includes('foto') && val.toString().includes('http')) {
                        let match = val.toString().match(/\/d\/(.+?)\//);
                        fotoUrl = match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w200` : val;
                    }
                    if (keyLower.includes('nama')) {
                        namaSiswa = val;
                    }
                }
            }

            document.getElementById('siswa-dashboard-foto').src = fotoUrl;
            document.getElementById('siswa-nama-display').innerText = namaSiswa;
            document.getElementById('siswa-nisn-display').innerText = appState.studentData.nisn;
            
            const badge = document.getElementById('siswa-status-badge');
            badge.innerText = appState.studentData.status || 'Aktif';
            if((appState.studentData.status||'').toLowerCase() === 'alumni'){
                badge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-800 border border-gray-300 shadow-sm';
            } else {
                badge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800 border border-green-200 shadow-sm';
            }

            const tabsMap = {};
            appState.formStructure.forEach(field => {
                if(!tabsMap[field.tab]) tabsMap[field.tab] = [];
                tabsMap[field.tab].push(field);
            });

            const navContainer = document.getElementById('siswa-tabs-nav');
            const contentContainer = document.getElementById('siswa-tabs-content');
            navContainer.innerHTML = ''; contentContainer.innerHTML = '';

            let kelasSiswa = 6; 
            if ((appState.studentData.status || '').toLowerCase() !== 'alumni') {
                for (let key in appState.studentData.fields) {
                    if (key.toLowerCase().includes('kelas')) {
                        let val = appState.studentData.fields[key];
                        let match = val ? val.toString().match(/\d+/) : null; 
                        if (match) kelasSiswa = parseInt(match[0]);
                        break;
                    }
                }
            }

            let firstTab = true;
            for (let tabName in tabsMap) {
                const safeTabId = 'tab_' + tabName.replace(/\s+/g, '_');
                let iconClass = getIconForTab(tabName);

                const btn = document.createElement('button');
                btn.className = `px-5 py-3 text-sm font-semibold whitespace-nowrap transition-colors flex items-center gap-2 ${firstTab ? 'text-blue-700 border-b-4 border-blue-600 bg-blue-50' : 'text-gray-500 border-b-4 border-transparent hover:bg-gray-50 hover:text-blue-500'}`;
                btn.innerHTML = `<i class="${iconClass} text-lg"></i> <span>${tabName}</span>`;
                btn.onclick = () => switchSiswaTab(safeTabId, btn);
                navContainer.appendChild(btn);

                const contentDiv = document.createElement('div');
                contentDiv.id = safeTabId;
                contentDiv.className = `tab-content-panel space-y-4 ${firstTab ? 'block' : 'hidden'}`;
                
                tabsMap[tabName].forEach(field => {
                    let sembunyikan = false;
                    let label = field.label.toLowerCase();
                    
                    if (label.includes('rapor') && label.includes('kelas')) {
                        let match = label.match(/kelas\s*(\d+)/);
                        if (match && parseInt(match[1]) > kelasSiswa) sembunyikan = true;
                    }
                    if ((label.includes('ijazah') || label.includes('lulus')) && kelasSiswa < 6) {
                        sembunyikan = true;
                    }
                    
                    if (!sembunyikan) {
                        contentDiv.appendChild(renderInputField(field, appState.studentData.fields[field.headerName]));
                    }
                });

                contentContainer.appendChild(contentDiv);
                firstTab = false;
            }
        }

        function switchSiswaTab(tabId, btnElement) {
            const navs = document.getElementById('siswa-tabs-nav').children;
            for(let n of navs) n.className = 'px-5 py-3 text-sm font-semibold whitespace-nowrap transition-colors flex items-center gap-2 text-gray-500 border-b-4 border-transparent hover:bg-gray-50 hover:text-blue-500';
            btnElement.className = 'px-5 py-3 text-sm font-semibold whitespace-nowrap transition-colors flex items-center gap-2 text-blue-700 border-b-4 border-blue-600 bg-blue-50';

            const panels = document.getElementsByClassName('tab-content-panel');
            for(let p of panels) p.classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');
        }

        function renderInputField(fieldDef, value) {
            const wrapper = document.createElement('div');
            wrapper.className = 'bg-white p-4 rounded-xl border border-gray-100 shadow-sm transition hover:shadow-md';
            
            const label = document.createElement('label');
            label.className = 'block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider';
            label.innerText = fieldDef.label;
            wrapper.appendChild(label);

            const isAlumni = (appState.studentData.status || '').toLowerCase() === 'alumni';

            if (fieldDef.type === 'file') {
                const fileUI = document.createElement('div');
                if (value && value.toString().startsWith('http')) {
                    fileUI.innerHTML = `<a href="${value}" target="_blank" class="inline-flex items-center px-3 py-1.5 bg-blue-50 text-blue-700 text-sm font-medium rounded-lg hover:bg-blue-100 transition break-all mb-3 border border-blue-200"><i class="fas fa-eye mr-2"></i> Lihat Berkas Tersimpan</a>`;
                }
                if(!isAlumni){
                    fileUI.innerHTML += `
                        <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:border-blue-500 transition cursor-pointer bg-gray-50">
                            <i class="fas fa-cloud-upload-alt text-gray-400 text-2xl mb-2"></i>
                            <p class="text-xs text-gray-500 font-medium mb-2">Ketuk untuk mengunggah berkas/foto baru</p>
                            <input type="file" onchange="processFileUpload(this, ${JSON.stringify(fieldDef).replace(/"/g, '&quot;')})" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        </div>`;
                }
                wrapper.appendChild(fileUI);
            } 
            else if (fieldDef.type.startsWith('select:')) {
                const options = fieldDef.type.split(':')[1].split(',');
                const select = document.createElement('select');
                select.className = 'w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-gray-50 font-medium text-gray-700 transition';
                select.name = fieldDef.headerName;
                select.disabled = isAlumni;
                select.innerHTML = '<option value="">-- Pilih --</option>';
                options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt; option.innerText = opt;
                    if(value === opt) option.selected = true;
                    select.appendChild(option);
                });
                select.onchange = (e) => { appState.pendingUpdates[e.target.name] = e.target.value; };
                wrapper.appendChild(select);
            }
            else if (fieldDef.type === 'textarea') {
                const input = document.createElement('textarea');
                input.className = 'w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-gray-50 font-medium text-gray-700 transition';
                input.rows = 3;
                input.name = fieldDef.headerName;
                input.value = value || '';
                input.disabled = isAlumni;
                input.onchange = (e) => { appState.pendingUpdates[e.target.name] = e.target.value; };
                wrapper.appendChild(input);
            }
            else {
                const input = document.createElement('input');
                input.className = 'w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-gray-50 font-medium text-gray-700 transition';
                input.name = fieldDef.headerName;
                input.disabled = isAlumni;
                
                if (fieldDef.type === 'number') input.type = 'number';
                else if (fieldDef.type === 'phone') { input.type = 'tel'; input.value = value || ''; }
                else input.type = 'text';

                if(fieldDef.type === 'currency' && value) {
                    input.value = "Rp " + new Intl.NumberFormat('id-ID').format(value);
                } else if(fieldDef.type === 'date') {
                    input.type = 'date';
                    input.value = konversiTanggalKeHTML(value);
                } else if (fieldDef.type !== 'currency') {
                    input.value = value || '';
                }

                if(fieldDef.type === 'currency') {
                    input.oninput = () => {
                        let val = input.value.replace(/\D/g, "");
                        if(val === "") { input.value = ""; return; }
                        input.value = "Rp " + new Intl.NumberFormat('id-ID').format(val);
                        appState.pendingUpdates[input.name] = val;
                    };
                } else {
                    input.onchange = (e) => { appState.pendingUpdates[e.target.name] = e.target.value; };
                }
                wrapper.appendChild(input);
            }
            return wrapper;
        }

        // GURU DASHBOARD & REKAP

        function buildGuruDashboard() {
            renderListSiswa(appState.allStudents);
            hitungRekapanSiswa();

        function filterSiswa() {
            const query = document.getElementById('search-siswa').value.toLowerCase();
            const filtered = appState.allStudents.filter(stu => {
                let matchString = stu.nisn.toString().toLowerCase();
                for(let key in stu.fields){
                    if(stu.fields[key]) matchString += " " + stu.fields[key].toString().toLowerCase();
                }
                return matchString.includes(query);
            });
            renderListSiswa(filtered);
        }

        function renderListSiswa(list) {
            const container = document.getElementById('list-siswa');
            container.innerHTML = '';
            if (list.length === 0) { container.innerHTML = '<div class="p-6 text-center text-gray-500">Tidak ada siswa ditemukan.</div>'; return; }

            list.forEach(stu => {
                let nama = "Tanpa Nama", kelas = "-";
                for(let key in stu.fields){
                    if(key.toLowerCase().includes('nama')) nama = stu.fields[key] || nama;
                    if(key.toLowerCase().includes('kelas')) kelas = stu.fields[key] || kelas;
                }

                const item = document.createElement('div');
                item.className = 'p-4 bg-white hover:bg-blue-50 cursor-pointer flex justify-between items-center border-b transition';
                item.onclick = () => openDetailSiswa(stu.nisn);
                
                item.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800">${nama} <span class="ml-2 text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-bold uppercase border border-blue-200">Kls ${kelas}</span></p>
                        <p class="text-xs text-gray-500 mt-1 font-medium"><i class="fas fa-id-card mr-1"></i> NISN: ${stu.nisn}</p>
                    </div>
                    <i class="fas fa-chevron-right text-blue-400"></i>
                `;
                container.appendChild(item);
            });
        }

        function hitungRekapanSiswa() {
            if(!appState.allStudents) return;

            const rekapKelasSpesifik = {}; 
            const rekapTingkat = { 1: {L:0, P:0}, 2: {L:0, P:0}, 3: {L:0, P:0}, 4: {L:0, P:0}, 5: {L:0, P:0}, 6: {L:0, P:0} };
            const setAgama = new Set(); 
            
            let totalSemua = 0, totalSemuaL = 0, totalSemuaP = 0;

            appState.allStudents.forEach(siswa => {
                if ((siswa.status || '').toLowerCase() === 'alumni') return;

                let namaKelas = '-', jk = '-', agama = 'Lainnya';

                for (let key in siswa.fields) {
                    let keyLower = key.toLowerCase();
                    if (keyLower.includes('kelas')) namaKelas = (siswa.fields[key] || '-').toString().trim().toUpperCase();
                    if (keyLower.includes('kelamin') || keyLower.includes('jk')) {
                        let valJk = (siswa.fields[key] || '').toString().trim().toUpperCase();
                        if (valJk.startsWith('L')) jk = 'L';
                        if (valJk.startsWith('P')) jk = 'P';
                    }
                    if (keyLower.includes('agama')) {
                        agama = (siswa.fields[key] || 'Lainnya').toString().trim();
                        if(agama !== '-' && agama !== '') setAgama.add(agama);
                    }
                }

                let matchTingkat = namaKelas.match(/\d+/);
                let angkaTingkat = matchTingkat ? parseInt(matchTingkat[0]) : null;

                if (angkaTingkat && angkaTingkat >= 1 && angkaTingkat <= 6) {
                    totalSemua++;
                    if (jk === 'L') totalSemuaL++;
                    if (jk === 'P') totalSemuaP++;

                    if (jk === 'L') rekapTingkat[angkaTingkat].L++;
                    if (jk === 'P') rekapTingkat[angkaTingkat].P++;

                    if (!rekapKelasSpesifik[namaKelas]) {
                        rekapKelasSpesifik[namaKelas] = { L: 0, P: 0, total: 0, agamaRekap: {} };
                    }
                    rekapKelasSpesifik[namaKelas].total++;
                    if (jk === 'L') rekapKelasSpesifik[namaKelas].L++;
                    if (jk === 'P') rekapKelasSpesifik[namaKelas].P++;
                    
                    if(!rekapKelasSpesifik[namaKelas].agamaRekap[agama]) rekapKelasSpesifik[namaKelas].agamaRekap[agama] = 0;
                    rekapKelasSpesifik[namaKelas].agamaRekap[agama]++;
                }
            });

            const container = document.getElementById('guru-rekapan-container');
            const daftarKelasTerurut = Object.keys(rekapKelasSpesifik).sort();
            const daftarAgama = Array.from(setAgama).sort(); 

            let htmlTingkat = '';
            for (let t = 1; t <= 6; t++) {
                let totalT = rekapTingkat[t].L + rekapTingkat[t].P;
                htmlTingkat += `
                    <div class="bg-white p-3 rounded-xl border shadow-sm text-center">
                        <div class="font-bold text-blue-800 text-sm border-b border-blue-50 pb-1">Kelas ${t}</div>
                        <div class="text-2xl font-black text-gray-800 my-1">${totalT}</div>
                        <div class="text-xs text-gray-500 font-bold flex justify-center gap-3">
                            <span class="text-blue-500"><i class="fas fa-male"></i> ${rekapTingkat[t].L}</span>
                            <span class="text-pink-500"><i class="fas fa-female"></i> ${rekapTingkat[t].P}</span>
                        </div>
                    </div>
                `;
            }

            let thAgama = '';
            let sumTotalAgama = {};
            daftarAgama.forEach(ag => { 
                thAgama += `<th class="px-3 py-2 text-center text-gray-600 font-bold border-l">${ag}</th>`; 
                sumTotalAgama[ag] = 0; 
            });

            let htmlSpesifik = '';
            let sumL = 0, sumP = 0, sumTotalKls = 0;

            daftarKelasTerurut.forEach(kls => {
                let d = rekapKelasSpesifik[kls];
                sumL += d.L; sumP += d.P; sumTotalKls += d.total; 
                
                let tdAgama = '';
                daftarAgama.forEach(ag => { 
                    let jumlahAgama = d.agamaRekap[ag] || 0;
                    sumTotalAgama[ag] += jumlahAgama; 
                    tdAgama += `<td class="px-3 py-2 text-center border-l text-gray-600">${jumlahAgama > 0 ? jumlahAgama : '-'}</td>`; 
                });

                htmlSpesifik += `
                    <tr class="border-b hover:bg-gray-50 text-xs sm:text-sm">
                        <td class="px-4 py-2 font-bold text-gray-700 whitespace-nowrap">${kls}</td>
                        <td class="px-3 py-2 text-center text-blue-600 font-bold bg-blue-50/50">${d.L}</td>
                        <td class="px-3 py-2 text-center text-pink-600 font-bold bg-pink-50/50">${d.P}</td>
                        <td class="px-4 py-2 text-center font-black bg-gray-200 text-gray-800">${d.total}</td>
                        ${tdAgama}
                    </tr>
                `;
            });

            let tdAgamaTotalRow = '';
            daftarAgama.forEach(ag => {
                tdAgamaTotalRow += `<td class="px-3 py-3 text-center border-l font-black text-gray-800">${sumTotalAgama[ag] > 0 ? sumTotalAgama[ag] : '-'}</td>`;
            });

            let rowTotalAkhir = `
                <tr class="bg-blue-100 border-t-2 border-blue-300 text-xs sm:text-sm">
                    <td class="px-4 py-3 font-black text-blue-900 text-right whitespace-nowrap">TOTAL :</td>
                    <td class="px-3 py-3 text-center text-blue-800 font-black">${sumL}</td>
                    <td class="px-3 py-3 text-center text-pink-800 font-black">${sumP}</td>
                    <td class="px-4 py-3 text-center font-black bg-blue-200 text-blue-900">${sumTotalKls}</td>
                    ${tdAgamaTotalRow}
                </tr>
            `;

            container.innerHTML = `
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div class="bg-gradient-to-br from-blue-500 to-blue-700 p-3 rounded-xl text-white shadow">
                        <div class="text-[10px] uppercase font-bold opacity-80"><i class="fas fa-users mr-1"></i> Total Siswa</div>
                        <div class="text-3xl font-black mt-1">${totalSemua}</div>
                    </div>
                    <div class="bg-gradient-to-br from-indigo-400 to-indigo-600 p-3 rounded-xl text-white shadow">
                        <div class="text-[10px] uppercase font-bold opacity-80"><i class="fas fa-male mr-1"></i> Laki-Laki</div>
                        <div class="text-3xl font-black mt-1">${totalSemuaL}</div>
                    </div>
                    <div class="bg-gradient-to-br from-pink-400 to-pink-600 p-3 rounded-xl text-white shadow">
                        <div class="text-[10px] uppercase font-bold opacity-80"><i class="fas fa-female mr-1"></i> Perempuan</div>
                        <div class="text-3xl font-black mt-1">${totalSemuaP}</div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <button onclick="document.getElementById('rekap-detail').classList.toggle('hidden')" class="w-full flex justify-between items-center p-4 bg-gray-50 hover:bg-gray-100 transition focus:outline-none">
                        <span class="font-bold text-gray-700 text-xs sm:text-sm"><i class="fas fa-chart-pie mr-2 text-blue-600 text-lg"></i> BUKA DETAIL REKAP & AGAMA</span>
                        <i class="fas fa-chevron-down text-gray-400"></i>
                    </button>
                    
                    <div id="rekap-detail" class="hidden p-4 border-t border-gray-200">
                        <h4 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider"><i class="fas fa-layer-group mr-1"></i> Rekap Per Tingkat</h4>
                        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-6">${htmlTingkat}</div>

                        <h4 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider"><i class="fas fa-table mr-1"></i> Rekap Spesifik & Agama</h4>
                        <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
                            <table class="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr class="bg-gray-100 text-[11px] sm:text-xs text-gray-600 uppercase tracking-wider border-b border-gray-200">
                                        <th class="px-4 py-3 font-bold">Kelas</th>
                                        <th class="px-3 py-3 text-center text-blue-700 font-bold">L</th>
                                        <th class="px-3 py-3 text-center text-pink-700 font-bold">P</th>
                                        <th class="px-4 py-3 text-center bg-gray-200 text-gray-800 font-bold">Total</th>
                                        ${thAgama}
                                    </tr>
                                </thead>
                                <tbody>${htmlSpesifik}</tbody>
                                <tfoot>${rowTotalAkhir}</tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // CETAK CV & DETAIL (DENGAN FILTER KELAS)
        // ==========================================
        function openDetailSiswa(nisn) {
            const student = appState.allStudents.find(s => s.nisn === nisn);
            if (!student) return;

            const container = document.getElementById('detail-siswa-content');
            const printContainer = document.getElementById('print-content');
            container.innerHTML = ''; printContainer.innerHTML = '';

            const tabsMap = {};
            appState.formStructure.forEach(field => {
                if(!tabsMap[field.tab]) tabsMap[field.tab] = [];
                tabsMap[field.tab].push(field);
            });

            let photoUrl = '';
            let kelasSiswa = 6; 
            if ((student.status || '').toLowerCase() !== 'alumni') {
                for (let key in student.fields) {
                    if (key.toLowerCase().includes('kelas')) {
                        let val = student.fields[key];
                        let match = val ? val.toString().match(/\d+/) : null;
                        if (match) kelasSiswa = parseInt(match[0]);
                        break;
                    }
                }
            }
            
            for (let tabName in tabsMap) {
                const section = document.createElement('div');
                section.className = 'mb-4 bg-white p-5 rounded-xl shadow-sm border border-gray-200';
                
                let iconClass = getIconForTab(tabName);
                section.innerHTML = `<h3 class="font-bold text-lg text-blue-800 border-b-2 border-blue-100 pb-2 mb-4"><i class="${iconClass} mr-2"></i>${tabName}</h3>`;
                
                const printSection = document.createElement('div');
                printSection.className = 'cv-section';
                printSection.innerHTML = `<div class="cv-section-title">${tabName}</div>`;

                tabsMap[tabName].forEach(field => {
                    let sembunyikan = false;
                    let label = field.label.toLowerCase();
                    
                    if (label.includes('rapor') && label.includes('kelas')) {
                        let match = label.match(/kelas\s*(\d+)/);
                        if (match && parseInt(match[1]) > kelasSiswa) sembunyikan = true;
                    }
                    if ((label.includes('ijazah') || label.includes('lulus')) && kelasSiswa < 6) sembunyikan = true;
                    
                    if (sembunyikan) return; 

                    let val = student.fields[field.headerName] || '-';
                    let displayVal = val;
                    if(field.type === 'currency' && val !== '-') displayVal = "Rp " + new Intl.NumberFormat('id-ID').format(val);
                    else if (field.type === 'date' && val !== '-') {
                        try {
                            let d = new Date(val);
                            if (!isNaN(d.getTime())) displayVal = d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
                        } catch(e) {}
                    }

                    const row = document.createElement('div');
                    row.className = 'mb-2 flex flex-col sm:flex-row sm:justify-between border-b border-dashed border-gray-200 pb-2 text-sm';
                    let valHtml = `<span class="text-gray-800 font-bold">${displayVal}</span>`;
                    
                    if (field.type === 'file' && val !== '-') {
                        if(field.label.toLowerCase().includes('foto')) photoUrl = val; 
                        valHtml = `<a href="${val}" target="_blank" class="text-blue-600 font-bold hover:underline bg-blue-50 px-2 py-1 rounded"><i class="fas fa-external-link-alt mr-1"></i> Buka Berkas</a>`;
                    }

                    row.innerHTML = `<span class="text-gray-500 uppercase tracking-wide text-xs mb-1 sm:mb-0">${field.label}</span> ${valHtml}`;
                    section.appendChild(row);

                    if(field.type !== 'file' || (field.type === 'file' && !field.label.toLowerCase().includes('foto'))){
                        const pRow = document.createElement('div');
                        pRow.className = 'cv-row';
                        pRow.innerHTML = `<div class="cv-label">${field.label}</div><div class="cv-value">: ${field.type === 'file' ? 'Terlampir' : displayVal}</div>`;
                        printSection.appendChild(pRow);
                    }
                });

                if (section.children.length > 1) {
                    container.appendChild(section);
                    printContainer.appendChild(printSection);
                }
            }

            if(photoUrl){
                const img = document.createElement('img');
                img.src = photoUrl;
                img.className = 'cv-photo';
                printContainer.insertBefore(img, printContainer.firstChild);
            }

            document.getElementById('view-guru').classList.add('hidden');
            document.getElementById('view-guru-detail').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function closeDetailSiswa() {
            document.getElementById('view-guru-detail').classList.add('hidden');
            document.getElementById('view-guru').classList.remove('hidden');
        }

        switchLoginTab('siswa');

    </script>
</body>
</html>
